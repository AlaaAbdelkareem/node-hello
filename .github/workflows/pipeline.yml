name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Runs every time you push to the main branch
  pull_request:
    branches: [ "master" ]

  env:
    TF_VAR_docker_username: ${{ secrets.DOCKER_USERNAME }}
    TF_VAR_docker_password: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # STEP 1 LINTING
      - name: Install Dependencies
        run: npm install


      - name: Run Linting
        run: npm run lint #|| echo "Linting failed, but moving to build for demo" 

      # STEP 2 DOCKER LOGIN
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # STEP 3 BUILD & PUSH
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nawy-app:latest
  
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # Wait for the build to finish first
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    env:
          TF_VAR_docker_username: ${{ secrets.DOCKER_USERNAME }}
          TF_VAR_docker_password: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Recommended for cleaner logs in CI

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform

      - name: Terraform Apply
        # Only apply on pushes to master
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: terraform apply -auto-approve
        working-directory: ./terraform
      
