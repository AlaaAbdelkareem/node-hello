name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Runs every time you push to the main branch
  pull_request:
    branches: [ "master" ]

jobs:
  build-Docker-Image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # STEP 1 LINTING
      - name: Install Dependencies
        run: npm install

      - name: install Lint  
        run: npm install eslint

      - name: Run Linting
        run: npm run lint #|| echo "Linting failed, but moving to build for demo" 

      # STEP 2 DOCKER LOGIN
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # STEP 3 BUILD & PUSH
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nawy-app:latest